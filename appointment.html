<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book an Appointment — Tahsinullah Riyad</title><style>body{font-family:system-ui;margin:0;background:#0d0d0f;color:#fff;display:grid;place-items:center;min-height:100vh;padding:20px}main{width:min(520px,100%);background:#151518;border:1px solid #333;border-radius:20px;padding:24px;box-sizing:border-box}h1{font-size:22px}p{color:#aaa;font-size:13px}label{display:block;font-size:13px;color:#bbb;margin:12px 0}input,select,textarea{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:11px;border-radius:10px;border:1px solid #333;background:#09090b;color:#fff}button{width:100%;padding:12px;border:0;border-radius:10px;background:#f97316;color:#fff;font-weight:700;margin-top:12px}#result{font-size:13px;margin-top:12px;color:#aaa}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body><main><h1>Book an Appointment</h1><p>Submit your preferred date and time. Your request will be sent to the administrator through Telegram.</p><form id="f"><label>Name<input name="name" required maxlength="100"></label><label>Phone / WhatsApp<input name="phone" required maxlength="40"></label><label>Email (optional)<input name="email" type="email" maxlength="160"></label><label>Service / Appointment Type<input name="service" required maxlength="120"></label><div class="row"><label>Date<input name="date" type="date" required></label><label>Time<select name="time" required><option value="">Select</option><option>09:00</option><option>09:30</option><option>10:00</option><option>10:30</option><option>11:00</option><option>11:30</option><option>12:00</option><option>12:30</option><option>13:00</option><option>13:30</option><option>14:00</option><option>14:30</option><option>15:00</option><option>15:30</option><option>16:00</option><option>16:30</option><option>17:00</option><option>17:30</option><option>18:00</option><option>18:30</option><option>19:00</option></select></label></div><label>Message (optional)<textarea name="message" maxlength="1000" rows="4"></textarea></label><button id="submit">Confirm Appointment</button><div id="result"></div></form></main><script>const f=document.getElementById("f"),r=document.getElementById("result"),s=document.getElementById("submit");f.elements.date.value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);f.onsubmit=async e=>{e.preventDefault();s.disabled=true;r.textContent="Checking availability...";const d=Object.fromEntries(new FormData(f));try{const q=await fetch("/api/appointments/availability?date="+encodeURIComponent(d.date)),a=await q.json();if(!q.ok)throw Error(a.error||"Availability check failed");if(a.booked.includes(d.time))throw Error("That time is already booked.");const z=await fetch("/api/appointments",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)}),v=await z.json();if(!z.ok)throw Error(v.error||"Booking failed");r.textContent="Appointment submitted successfully. Booking ID: "+v.appointment.id;f.reset()}catch(e){r.textContent=e.message||"Booking failed."}finally{s.disabled=false}};</script></body></html>
