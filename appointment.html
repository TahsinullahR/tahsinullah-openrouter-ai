<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff7a00">
<title>Book an Appointment — Tahsinullah Riyad</title>
<style>
:root{--orange:#ff7a00;--orange-dark:#d95f00;--bg:#090909;--card:#121212;--input:#0d0d0d;--border:rgba(255,255,255,.1);--text:#fff;--muted:#a5a5a5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,rgba(255,122,0,.18),transparent 32%),radial-gradient(circle at 85% 90%,rgba(255,122,0,.08),transparent 30%),var(--bg);display:flex;justify-content:center;padding:42px 18px}.container{width:100%;max-width:760px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand-mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--orange),var(--orange-dark));box-shadow:0 12px 35px rgba(255,122,0,.28);font-weight:900}.brand-name{font-weight:800;font-size:17px}.brand-sub{color:var(--muted);font-size:12px}.card{background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid var(--border);border-radius:26px;padding:34px;backdrop-filter:blur(18px);box-shadow:0 30px 90px rgba(0,0,0,.5)}h1{margin:0;font-size:clamp(30px,6vw,48px);line-height:1.05;letter-spacing:-1.8px}h1 span{color:var(--orange)}.intro{color:var(--muted);line-height:1.7;margin:14px 0 30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.field{display:flex;flex-direction:column;gap:8px}.full{grid-column:1/-1}label{font-size:13px;font-weight:700;color:#ddd}input,select,textarea{width:100%;border:1px solid var(--border);outline:none;border-radius:13px;background:var(--input);color:var(--text);padding:14px 15px;font:inherit}input:focus,select:focus,textarea:focus{border-color:rgba(255,122,0,.8);box-shadow:0 0 0 4px rgba(255,122,0,.1)}select option{background:#111;color:#fff}textarea{min-height:125px;resize:vertical}.actions{margin-top:24px}button{width:100%;border:0;cursor:pointer;border-radius:13px;padding:14px 21px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--orange),var(--orange-dark));box-shadow:0 14px 35px rgba(255,122,0,.22)}button:disabled{opacity:.55;cursor:not-allowed}.status{margin-top:18px;border-radius:13px;padding:13px 15px;display:none;font-size:13px;line-height:1.5}.status.success{display:block;background:rgba(50,213,131,.1);border:1px solid rgba(50,213,131,.25);color:#9ff0c5}.status.error{display:block;background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.25);color:#ffb0b0}.booking-id{display:inline-block;margin-top:8px;color:#fff;font-weight:900}.footer{text-align:center;color:#666;font-size:11px;margin-top:20px}@media(max-width:640px){body{padding:20px 12px}.card{padding:22px 17px;border-radius:20px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<main class="container">
<div class="brand"><div class="brand-mark">TR</div><div><div class="brand-name">Tahsinullah Riyad</div><div class="brand-sub">Creative Digital Services</div></div></div>
<section class="card">
<h1>Book an <span>Appointment</span></h1>
<p class="intro">Choose a convenient date and time. Submit your details and your appointment request will be sent for confirmation.</p>
<form id="appointmentForm"><div class="grid">
<div class="field"><label>Full Name *</label><input name="name" required maxlength="100" placeholder="Your full name"></div>
<div class="field"><label>Phone / WhatsApp *</label><input name="phone" required maxlength="40" placeholder="+880..."></div>
<div class="field full"><label>Email</label><input name="email" type="email" maxlength="160" placeholder="you@example.com"></div>
<div class="field full"><label>Service / Appointment Type *</label><select name="service" required><option value="">Select a service</option><option>Web Development</option><option>AI Development</option><option>Graphic Design</option><option>Video Editing</option><option>Social Media Management</option><option>Digital Marketing</option><option>SEO</option><option>Website Consultation</option><option>AI Consultation</option><option>Business Consultation</option><option>Other</option></select></div>
<div class="field"><label>Date *</label><input id="date" name="date" type="date" required></div>
<div class="field"><label>Time *</label><select id="time" name="time" required><option value="">Select time</option><option>09:00</option><option>09:30</option><option>10:00</option><option>10:30</option><option>11:00</option><option>11:30</option><option>12:00</option><option>12:30</option><option>13:00</option><option>13:30</option><option>14:00</option><option>14:30</option><option>15:00</option><option>15:30</option><option>16:00</option><option>16:30</option><option>17:00</option><option>17:30</option><option>18:00</option><option>18:30</option><option>19:00</option></select></div>
<div class="field full"><label>Message</label><textarea name="message" maxlength="1000" placeholder="Tell me briefly what you would like to discuss..."></textarea></div>
</div><div class="actions"><button id="submitBtn" type="submit">Book Appointment</button></div><div id="status" class="status"></div></form>
</section><div class="footer">© Tahsinullah Riyad · Appointment System</div>
</main>
<script>
const f=document.getElementById("appointmentForm"),date=document.getElementById("date"),time=document.getElementById("time"),btn=document.getElementById("submitBtn"),out=document.getElementById("status");
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}date.min=today();
async function check(){if(!date.value||!time.value)return true;const r=await fetch("/api/appointments/availability?date="+encodeURIComponent(date.value));const d=await r.json();if(!r.ok)throw Error(d.error||"Availability check failed");if(Array.isArray(d.booked)&&d.booked.includes(time.value)){out.className="status error";out.textContent="That time is already booked. Please select another time.";return false}return true}
f.onsubmit=async e=>{e.preventDefault();btn.disabled=true;out.className="status";try{if(!(await check()))return;btn.textContent="Booking...";const r=await fetch("/api/appointments",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const d=await r.json();if(!r.ok)throw Error(d.error||"Booking failed.");const id=d.id||d.appointment?.id||"Generated";out.className="status success";out.innerHTML="Appointment request submitted successfully.<br><span class='booking-id'>Booking ID: "+id+"</span>";f.reset();date.min=today()}catch(e){out.className="status error";out.textContent=e.message||"Booking failed."}finally{btn.disabled=false;btn.textContent="Book Appointment"}};
</script>
</body>
</html>
