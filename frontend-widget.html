<!-- Tahsinullah Riyad — OpenRouter AI Widget -->
<style>
#tr-ai-toggle{position:fixed;right:22px;bottom:22px;z-index:99999;width:60px;height:60px;border:1px solid rgba(249,115,22,.45);border-radius:18px;background:linear-gradient(145deg,#ff8a2a,#f97316);color:#fff;cursor:pointer;font:700 25px/1 system-ui,sans-serif;box-shadow:0 12px 35px rgba(249,115,22,.28);transition:transform .2s,box-shadow .2s}
#tr-ai-toggle:hover{transform:translateY(-3px);box-shadow:0 16px 42px rgba(249,115,22,.38)}
#tr-ai-toggle:focus-visible,#tr-ai-close:focus-visible,#tr-ai-send:focus-visible,#tr-ai-new:focus-visible,#tr-ai-input:focus-visible{outline:2px solid #fb923c;outline-offset:2px}
#tr-ai-window{display:none;position:fixed;right:22px;bottom:94px;z-index:99999;width:min(410px,calc(100vw - 28px));height:min(650px,calc(100vh - 120px));background:#0d0d0f;color:#fff;border:1px solid rgba(255,255,255,.10);border-radius:24px;overflow:hidden;box-shadow:0 28px 90px rgba(0,0,0,.62),0 0 0 1px rgba(249,115,22,.08);flex-direction:column;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
#tr-ai-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:linear-gradient(180deg,rgba(31,31,34,.96),rgba(18,18,20,.96));border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px)}
.tr-ai-brand{display:flex;align-items:center;gap:10px}.tr-ai-avatar{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#ff9a3c,#f97316);box-shadow:0 6px 18px rgba(249,115,22,.25);font-size:17px}.tr-ai-title{display:flex;flex-direction:column;gap:2px}.tr-ai-title strong{font-size:14px}.tr-ai-status{font-size:11px;color:#8f8f96;display:flex;align-items:center;gap:5px}.tr-ai-status-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.55)}
.tr-ai-actions{display:flex;align-items:center;gap:5px}.tr-ai-icon-btn{height:34px;border:0;border-radius:10px;background:transparent;color:#9a9aa1;cursor:pointer;padding:0 9px;font-size:12px}.tr-ai-icon-btn:hover{background:rgba(255,255,255,.07);color:#fff}.tr-ai-icon-btn .icon{font-size:15px;margin-right:4px}#tr-ai-close{font-size:22px;padding:0;width:34px;line-height:1}
#tr-ai-messages{flex:1;overflow-y:auto;padding:18px 15px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
#tr-ai-messages::-webkit-scrollbar{width:7px}#tr-ai-messages::-webkit-scrollbar-thumb{background:#2a2a2e;border-radius:20px}
.tr-ai-msg{max-width:88%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;font-size:13.5px;animation:trAiIn .18s ease-out}.tr-ai-bot{align-self:flex-start;background:#19191c;color:#ececef;border:1px solid rgba(255,255,255,.06);border-bottom-left-radius:6px}.tr-ai-user{align-self:flex-end;background:linear-gradient(145deg,#fb923c,#f97316);color:#fff;border-bottom-right-radius:6px;box-shadow:0 6px 18px rgba(249,115,22,.16)}
.tr-ai-thinking{display:inline-flex;align-items:center;gap:4px;color:#a5a5ac}.tr-ai-thinking i{width:5px;height:5px;border-radius:50%;background:#a5a5ac;animation:trAiDot 1s infinite}.tr-ai-thinking i:nth-child(2){animation-delay:.15s}.tr-ai-thinking i:nth-child(3){animation-delay:.3s}
#tr-ai-form{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(255,255,255,.08);background:#121214}#tr-ai-input{flex:1;min-width:0;height:44px;border:1px solid #2d2d31;border-radius:13px;padding:0 13px;outline:none;background:#0b0b0d;color:#fff;font:inherit;font-size:13px}#tr-ai-input::placeholder{color:#6f6f76}#tr-ai-input:focus{border-color:rgba(249,115,22,.7)}
#tr-ai-send{width:44px;height:44px;border:0;border-radius:13px;background:#f97316;color:#fff;cursor:pointer;font-size:18px;display:grid;place-items:center}#tr-ai-send:hover:not(:disabled){background:#fb7c20}#tr-ai-send:disabled{opacity:.45;cursor:not-allowed}.tr-ai-footer{text-align:center;font-size:9px;color:#55555b;padding:0 12px 9px;background:#121214}
@keyframes trAiIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes trAiDot{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
@media(max-width:600px){#tr-ai-toggle{right:15px;bottom:15px;width:56px;height:56px;border-radius:17px}#tr-ai-window{right:8px;bottom:80px;width:calc(100vw - 16px);height:min(72vh,650px);border-radius:20px}.tr-ai-icon-btn{padding:0 7px}}
@media(prefers-reduced-motion:reduce){#tr-ai-toggle,.tr-ai-msg,#tr-ai-send{transition:none;animation:none}}
</style>

<button id="tr-ai-toggle" type="button" aria-label="Open Tahsinullah AI" aria-controls="tr-ai-window" aria-expanded="false">✦</button>
<div id="tr-ai-window" role="dialog" aria-modal="false" aria-labelledby="tr-ai-title" aria-hidden="true">
<div id="tr-ai-header"><div class="tr-ai-brand"><div class="tr-ai-avatar" aria-hidden="true">✦</div><div class="tr-ai-title"><strong id="tr-ai-title">Tahsinullah AI</strong><span class="tr-ai-status"><span class="tr-ai-status-dot"></span>AI assistant</span></div></div><div class="tr-ai-actions"><button id="tr-ai-book" class="tr-ai-icon-btn" type="button" aria-label="Book an appointment">Book</button><button id="tr-ai-new" class="tr-ai-icon-btn" type="button" aria-label="Start a new chat"><span class="icon">＋</span>New</button><button id="tr-ai-close" class="tr-ai-icon-btn" type="button" aria-label="Close AI assistant">×</button></div></div>
<div id="tr-ai-messages" aria-live="polite"></div>
<form id="tr-ai-form"><input id="tr-ai-input" type="text" autocomplete="off" maxlength="12000" placeholder="Ask anything..." aria-label="Message"/><button id="tr-ai-send" type="submit" aria-label="Send message">➤</button></form>
<div class="tr-ai-footer">Powered by OpenRouter</div>
</div>

<script>
(() => {
const CHAT_API="/api/chat",STORAGE_KEY="tr-ai-chat-history-v1",WELCOME="Hi! I’m Tahsinullah AI. Ask me about coding, technology, math, science, writing, or anything else.",toggle=document.getElementById("tr-ai-toggle"),close=document.getElementById("tr-ai-close"),newChat=document.getElementById("tr-ai-new"),win=document.getElementById("tr-ai-window"),messagesEl=document.getElementById("tr-ai-messages"),form=document.getElementById("tr-ai-form"),input=document.getElementById("tr-ai-input"),send=document.getElementById("tr-ai-send");
let messages=[],streaming=false;

function openChat(){win.style.display="flex";win.setAttribute("aria-hidden","false");toggle.setAttribute("aria-expanded","true");setTimeout(()=>input.focus(),50)}
function closeChat(){if(streaming)return;win.style.display="none";win.setAttribute("aria-hidden","true");toggle.setAttribute("aria-expanded","false");toggle.focus()}
function addMessage(role,text,save=true){const el=document.createElement("div");el.className="tr-ai-msg "+(role==="user"?"tr-ai-user":"tr-ai-bot");el.textContent=text;messagesEl.appendChild(el);if(save)saveHistory();return el}
function setThinking(el){el.innerHTML='<span class="tr-ai-thinking"><span>Thinking</span><i></i><i></i><i></i></span>'}
function nearBottom(){return messagesEl.scrollHeight-messagesEl.scrollTop-messagesEl.clientHeight<90}
function updateBot(el,text){el.textContent=text;if(nearBottom())messagesEl.scrollTop=messagesEl.scrollHeight}
function renderHistory(){messagesEl.innerHTML="";addMessage("assistant",WELCOME,false);for(const m of messages)addMessage(m.role,m.content,false);messagesEl.scrollTop=messagesEl.scrollHeight}
function saveHistory(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(messages.slice(-40)))}catch{}}
function loadHistory(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");if(Array.isArray(saved))messages=saved.filter(m=>(m.role==="user"||m.role==="assistant")&&typeof m.content==="string").slice(-40)}catch{messages=[]}renderHistory()}
function startNewChat(){if(streaming)return;messages=[];try{localStorage.removeItem(STORAGE_KEY)}catch{}renderHistory();input.value="";input.focus()}
function parseSSEBuffer(buffer,onData){const events=buffer.split(/\r?\n\r?\n/);const remainder=events.pop()||"";for(const event of events){for(const line of event.split(/\r?\n/)){if(!line.startsWith("data:"))continue;const data=line.slice(5).trim();if(data)onData(data)}}return remainder}
async function readStream(response,bot){
const reader=response.body.getReader(),decoder=new TextDecoder();let buffer="",fullText="";
const handleData=data=>{if(data==="[DONE]")return;if(data.startsWith("[ERROR]"))throw new Error(data.slice(7));const json=JSON.parse(data);if(json.error)throw new Error(json.error);const delta=json.choices?.[0]?.delta?.content||"";if(delta){fullText+=delta;updateBot(bot,fullText)}};
while(true){const {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});buffer=parseSSEBuffer(buffer,handleData)}
buffer+=decoder.decode();if(buffer.trim())parseSSEBuffer(buffer+"\n\n",handleData);return fullText
}
toggle.addEventListener("click",()=>win.style.display==="flex"?closeChat():openChat());close.addEventListener("click",closeChat);newChat.addEventListener("click",startNewChat);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&win.style.display==="flex")closeChat()});
form.addEventListener("submit",async event=>{
event.preventDefault();const text=input.value.trim();if(!text||streaming)return;
input.value="";streaming=true;send.disabled=true;input.disabled=true;newChat.disabled=true;addMessage("user",text);messages.push({role:"user",content:text});saveHistory();
const bot=addMessage("assistant","",false);setThinking(bot);
try{const response=await fetch(CHAT_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});if(!response.ok||!response.body){let detail="";try{detail=(await response.json()).error||""}catch{}throw new Error(detail||"AI backend unavailable")}
const fullText=await readStream(response,bot);if(!fullText)throw new Error("Empty AI response");messages.push({role:"assistant",content:fullText});saveHistory()
}catch(error){console.error("Tahsinullah AI:",error);bot.textContent=error.message.includes("Too many requests")?"You’ve reached the short-term request limit. Please wait a moment and try again.":"Sorry, I couldn’t complete that request. Please try again."}
finally{streaming=false;send.disabled=false;input.disabled=false;newChat.disabled=false;input.focus()}
});
const bookAppointment=document.getElementById("tr-ai-book");if(bookAppointment)bookAppointment.onclick=()=>window.open("https://tahsinullah-openrouter-ai.onrender.com/appointment","_blank","noopener");
loadHistory();
})();
</script>
