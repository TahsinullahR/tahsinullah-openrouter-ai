<style>
#tr-ai-toggle {
  position: fixed; right: 24px; bottom: 24px; z-index: 99999;
  width: 58px; height: 58px; border: 0; border-radius: 50%;
  background: #f97316; color: #fff; cursor: pointer; font-size: 24px;
  box-shadow: 0 8px 30px rgba(249,115,22,.35);
}
#tr-ai-window {
  display: none; position: fixed; right: 24px; bottom: 94px; z-index: 99999;
  width: min(390px, calc(100vw - 32px)); height: min(620px, calc(100vh - 120px));
  background: #0f0f10; color: #fff; border: 1px solid rgba(249,115,22,.35);
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 24px 80px rgba(0,0,0,.55);
  flex-direction: column; font-family: Inter, system-ui, sans-serif;
}
#tr-ai-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; background: rgba(20,20,20,.86);
  backdrop-filter: blur(18px); border-bottom: 1px solid #252525;
}
#tr-ai-header strong { font-size: 14px; }
#tr-ai-close {
  border: 0; background: transparent; color: #aaa; cursor: pointer; font-size: 20px;
}
#tr-ai-messages {
  flex: 1; overflow-y: auto; padding: 14px; display: flex;
  flex-direction: column; gap: 10px; overscroll-behavior: contain;
}
.tr-ai-msg {
  max-width: 86%; padding: 10px 13px; border-radius: 14px;
  white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; font-size: 14px;
}
.tr-ai-bot { align-self: flex-start; background: #1d1d1f; color: #eee; }
.tr-ai-user { align-self: flex-end; background: #f97316; color: #fff; }
#tr-ai-form {
  display: flex; gap: 8px; padding: 10px; border-top: 1px solid #252525;
  background: #141414;
}
#tr-ai-input {
  flex: 1; min-width: 0; border: 1px solid #333; border-radius: 10px;
  padding: 11px 12px; outline: none; background: #0d0d0d; color: #fff;
}
#tr-ai-send {
  border: 0; border-radius: 10px; padding: 0 15px;
  background: #f97316; color: #fff; cursor: pointer;
}
#tr-ai-send:disabled { opacity: .5; cursor: not-allowed; }
@media (max-width: 600px) {
  #tr-ai-toggle { right: 16px; bottom: 16px; }
  #tr-ai-window {
    right: 8px; bottom: 84px; width: calc(100vw - 16px);
    height: min(70vh, 620px); border-radius: 18px;
  }
}
</style>

<button id="tr-ai-toggle" aria-label="Open AI assistant">âœ¦</button>

<div id="tr-ai-window" role="dialog" aria-label="AI assistant">
  <div id="tr-ai-header">
    <strong>Tahsinullah AI</strong>
    <button id="tr-ai-close" aria-label="Close AI assistant">Ã—</button>
  </div>

  <div id="tr-ai-messages">
    <div class="tr-ai-msg tr-ai-bot">
      Hi! Ask me anything â€” coding, math, science, writing, general knowledge, or questions about this portfolio.
    </div>
  </div>

  <form id="tr-ai-form">
    <input id="tr-ai-input" autocomplete="off" placeholder="Ask anything..." />
    <button id="tr-ai-send" type="submit">âž¤</button>
  </form>
</div>

<script>
(() => {
  // IMPORTANT: replace this with your deployed backend URL.
  const CHAT_API = "/api/chat";

  const toggle = document.getElementById("tr-ai-toggle");
  const close = document.getElementById("tr-ai-close");
  const win = document.getElementById("tr-ai-window");
  const messagesEl = document.getElementById("tr-ai-messages");
  const form = document.getElementById("tr-ai-form");
  const input = document.getElementById("tr-ai-input");
  const send = document.getElementById("tr-ai-send");

  let messages = [];

  function openChat() {
    win.style.display = "flex";
    setTimeout(() => input.focus(), 50);
  }

  function closeChat() {
    win.style.display = "none";
  }

  function addMessage(role, text) {
    const el = document.createElement("div");
    el.className = "tr-ai-msg " + (role === "user" ? "tr-ai-user" : "tr-ai-bot");
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  toggle.addEventListener("click", openChat);
  close.addEventListener("click", closeChat);

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const text = input.value.trim();
    if (!text || send.disabled) return;

    input.value = "";
    send.disabled = true;

    addMessage("user", text);
    messages.push({ role: "user", content: text });

    const bot = addMessage("assistant", "Thinkingâ€¦");
    let fullText = "";

    try {
      const response = await fetch(CHAT_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages })
      });

      if (!response.ok || !response.body) {
        throw new Error("AI backend unavailable");
      }

      const result = await response.text();
      let jsonResponse = null;
      for (const line of result.split(/\r?\n/)) {
        if (!line.startsWith("data: ")) continue;
        const data = line.slice(6).trim();
        if (!data || data === "[DONE]") continue;
        try {
          const json = JSON.parse(data);
          if (json.error) {
            throw new Error(json.error);
          }
          const delta = json.choices?.[0]?.delta?.content || "";
          if (delta) {
            fullText += delta;
            bot.textContent = fullText;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        } catch (err) {
          console.warn("Response parse warning:", err);
        }
      }      if (!fullText) {
        bot.textContent = "I couldn't generate a response. Please try again.";
      } else {
        messages.push({ role: "assistant", content: fullText });
      }
    } catch (error) {
      console.error(error);
      bot.textContent = "Sorry, the AI is temporarily unavailable. Please try again.";
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
})();
</script>
